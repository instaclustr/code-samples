[project]
name = "rbac-shoe-bot"
version = "0.1.0"
description = "Streamlit chatbot demonstrating Auth0 login and role-based MCP tool access control against the MCP Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37",
    "boto3>=1.34",
    "mcp>=1.0.0",
    "httpx>=0.27",
    "requests>=2.32",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rbac_shoe_bot"]
